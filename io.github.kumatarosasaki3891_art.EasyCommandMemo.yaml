app-id: io.github.kumatarosasaki3891_art.EasyCommandMemo
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: EasyCommandMemo

finish-args:
  # Avalonia UI / X11 (Portal access for file dialogs and opening links is granted implicitly by Flatpak; no network or host access required)
  - --socket=x11
  - --share=ipc
  - --device=dri

sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet10

build-options:
  prepend-path: /usr/lib/sdk/dotnet10/bin
  append-ld-library-path: /usr/lib/sdk/dotnet10/lib
  prepend-pkg-config-path: /usr/lib/sdk/dotnet10/lib/pkgconfig
  env:
    DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

modules:
  - name: easycommandmemo
    buildsystem: simple
    build-commands:
      # 事前取得した NuGet パッケージ（nuget-sources）を参照して自己完結バイナリを発行
      - dotnet publish EasyCommandMemo/EasyCommandMemo.fsproj -c Release -r linux-x64 --self-contained true --source ./nuget-sources -o /app/lib/EasyCommandMemo

      # 起動コマンド (/app/bin/EasyCommandMemo) のシンボリックリンク作成
      - install -d /app/bin
      - ln -s /app/lib/EasyCommandMemo/EasyCommandMemo /app/bin/EasyCommandMemo

      # .desktop ファイルのインストール
      - install -Dm644 io.github.kumatarosasaki3891_art.EasyCommandMemo.desktop /app/share/applications/io.github.kumatarosasaki3891_art.EasyCommandMemo.desktop

      # metainfo.xml のインストール
      - install -Dm644 io.github.kumatarosasaki3891_art.EasyCommandMemo.metainfo.xml /app/share/metainfo/io.github.kumatarosasaki3891_art.EasyCommandMemo.metainfo.xml

      # アプリアイコン (256x256) のインストール
      - install -Dm644 EasyCommandMemo/Assets/icon-256.png /app/share/icons/hicolor/256x256/apps/io.github.kumatarosasaki3891_art.EasyCommandMemo.png

    sources:
      # ローカルソースからのビルド用（Flathub 提出時は下記の type: git に切り替える）
      - type: dir
        path: .
      # Flathub 審査・本番ビルド用（タグおよびコミットSHA固定）
      # - type: git
      #   url: https://github.com/kumatarosasaki3891-art/EasyCommandMemo.git
      #   tag: linux-v1.1.0
      #   commit: <COMMIT_SHA>
      # オフラインビルド用 NuGet パッケージ定義
      - nuget-sources.json
